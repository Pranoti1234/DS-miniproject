apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: inventory-data
  namespace: bloodlink
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: bloodlink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: bloodlink-inventory-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 5001}
          env:
            - {name: PORT, value: "5001"}
            - {name: INVENTORY_DB_PATH, value: /app/data/inventory.db}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
          volumeMounts:
            - {name: data, mountPath: /app/data}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: inventory-data
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: bloodlink
spec:
  type: NodePort
  selector:
    app: inventory-service
  ports:
    - {name: http, port: 5001, targetPort: http, nodePort: 30051}

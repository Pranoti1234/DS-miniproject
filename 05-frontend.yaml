apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: bloodlink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: bloodlink-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 80}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: bloodlink
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - {name: http, port: 80, targetPort: http, nodePort: 30080}

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: request-data
  namespace: bloodlink
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: request-service
  namespace: bloodlink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: request-service
  template:
    metadata:
      labels:
        app: request-service
    spec:
      containers:
        - name: request-service
          image: bloodlink-request-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 5002}
          env:
            - {name: PORT, value: "5002"}
            - {name: REQUEST_DB_PATH, value: /app/data/requests.db}
            - name: INVENTORY_SERVICE_URL
              valueFrom:
                configMapKeyRef: {name: bloodlink-config, key: INVENTORY_SERVICE_URL}
            - name: RABBITMQ_URL
              valueFrom:
                configMapKeyRef: {name: bloodlink-config, key: RABBITMQ_URL}
            - {name: ENABLE_RABBITMQ, value: "true"}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
          volumeMounts:
            - {name: data, mountPath: /app/data}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: request-data
---
apiVersion: v1
kind: Service
metadata:
  name: request-service
  namespace: bloodlink
spec:
  type: NodePort
  selector:
    app: request-service
  ports:
    - {name: http, port: 5002, targetPort: http, nodePort: 30052}
